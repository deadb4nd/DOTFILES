# Hearth — saturated warm-dark, identical palette to nvim (lua/hearth.lua) and
# alacritty (alacritty.toml). Ember accent on near-black, warm-left /
# cool-right syntax split. Every value here is the exact hex used in the
# editor, so the whole desktop reads as one machine.
# ── CORE ───────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# RGB (truecolor) for the terminals we actually run: alacritty and ghostty both
# advertise it. The old `*,xterm-256color:RGB` override applied to *every*
# client including 256-colour-only ones, which is how you get muddy gradients
# on a VNC session.
set -as terminal-features ",alacritty*:RGB"
set -as terminal-features ",ghostty*:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 0
set -g history-limit 50000
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display "reloaded"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S · #I:#W"

# ── NOISE CONTROL ──────────────────────────────────────────
set -g display-time 750
set -g status-interval 60
setw -g monitor-activity off
set -g visual-activity off
set -g bell-action none
set -g allow-rename off
set -g automatic-rename off

# ── BEHAVIOR ───────────────────────────────────────────────
setw -g mode-keys vi
# Mouse defaults to ON. nvim's config sets `mouse = "a"`, and with tmux-level
# mouse reporting off the terminal swallows the events and Neovim's mouse
# support silently does nothing. `prefix + m` still toggles it off.
set -g mouse on
bind m set -g mouse \; display "mouse #{?mouse,mouse on,mouse off}"

# ── NAVIGATION ─────────────────────────────────────────────
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind a last-window
bind \` next-layout
bind \x kill-pane
bind b break-pane

# swap panes with Alt-arrows, matching the vim muscle memory in nvim.
# Horizontal swap has to go through `swap-pane -s #{pane_left}` / `#{pane_right}`:
# swap-pane only accepts -U and -D as direction flags, so `swap-pane -L` and
# `swap-pane -R` fail with "unknown flag" and the bind is dropped without any
# message. Vertical can use the flags directly.
bind -n M-h swap-pane -s '#{pane_left}'
bind -n M-j swap-pane -D
bind -n M-k swap-pane -U
bind -n M-l swap-pane -s '#{pane_right}'

# zoom a pane in and out without leaving the layout
bind z resize-pane -Z

# ── WORKFLOW ──────────────────────────────────────────────
bind s choose-tree -Zs
# The `;` between the two commands has to be escaped as `\;`, otherwise tmux
# treats it as a command separator, ends the bind at `display-message`, and
# silently throws the `command-prompt` away — leaving a key that prints a
# prompt message and then never asks anything.
bind e display-message -p "rename this window (#W): " \; command-prompt -p "new name: " "rename-window '%%'"
bind T display-message -d 1000 "time #{t:local_time} on #{m:%Y-%m-%d}"
# Alt-1..Alt-9 to jump to a window. tmux-sensible already binds M-1..M-4 to
# select-layout in the *prefix* table, so these stay root-table (`-n`) and
# target the window index explicitly.
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# ── COPY MODE ────────────────────────────────────────────
# xclip is present here, but pick whichever clipboard tool exists so the same
# config survives moving to a Wayland session later.
if-shell -b "command -v xclip >/dev/null" \
  "set -g @copy_pipe 'xclip -in -selection clipboard'" \
  "if-shell -b 'command -v wl-copy >/dev/null' 'set -g @copy_pipe \"wl-copy\"' 'set -g @copy_pipe \"xclip -in -selection clipboard\"'"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{@copy_pipe}"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "#{@copy_pipe}"
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi Space send -X begin-selection
# Scroll by screen-half. `send -X -N -5` is wrong twice over: `-N` is a boolean
# ("don't leave copy-mode") and takes no argument, so the trailing `-5` was
# being passed to copy-mode as a bogus command name and only blew up on press.
# scroll-half-page-up/down are the real copy-mode commands.
bind -T copy-mode-vi C-Up send -X scroll-half-page-up
bind -T copy-mode-vi C-Down send -X scroll-half-page-down
bind -T copy-mode-vi C-Space send -X page-up
bind -T copy-mode-vi C-b send -X page-down
# leave copy mode and paste where you left it
bind -T copy-mode-vi q send -X cancel

# ── PANES ────────────────────────────────────────────────
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style "fg=#332C27"          # hearth bg3
set -g pane-active-border-style "fg=#FF9E64"   # hearth ember accent
set -g pane-border-format "#[fg=#78695E]#I #[fg=#FF9E64]♥ #[fg=#BFB3A8]#{pane_current_path}"
set -g pane-border-indicators colour
set -g display-panes-colour "#332C27"
set -g display-panes-active-colour "#FF9E64"

# ── STATUS BAR ───────────────────────────────────────────
# Written by hand rather than delegated to tmux-chroma.
#
# Why: chroma's resolve_colors() does `read -r bg bg_alt fg muted subtle
# border warn alert ink <<< "$(mode_anchors "$mode")"` and then only mixes the
# *surfaces* toward @chroma_background. `fg` is never mixed, so it stays chroma's
# dark anchor #d7dde7 — a cool blue-grey — no matter what you set. Its dark
# anchors are #15181d / #20242b / #d7dde7 / #8b96a8, which is a different colour
# system from hearth's, not a different preset. Verified on tmux 3.6b against
# chroma main: it would render #101216 canvas with #d7dde7 text regardless of
# every @chroma_* option set. So the bar is built here from hearth's real roles.
#
# Roles: canvas #100E0D · panel #191614 · raised #221E1B · border #332C27
#        ember #FF9E64 · body #F2EAE3 · dim #BFB3A8 · subtle #78695E
#        mint #7FE3C4 · red #FF5C5C
set -g status on
set -g status-interval 3
set -g status-position bottom
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 90
set -g status-style           "fg=#BFB3A8,bg=#100E0D"
set -g status-left-style      "fg=#BFB3A8,bg=#100E0D"
set -g status-right-style     "fg=#BFB3A8,bg=#100E0D"
set -g window-status-style    "fg=#78695E,bg=#191614"
# current window: ink on ember, so the active tab is unmissable
set -g window-status-current-style "fg=#100E0D,bg=#FF9E64,bold"
set -g window-status-separator " "

set -g status-left "#[fg=#FF9E64]♥#[fg=#100E0D] #[fg=#F2EAE3,bold]#S #[fg=#332C27]│ #[fg=#BFB3A8]#(whoami)@#H "
set -g status-right "#[fg=#332C27]│ #[fg=#78695E]load #[fg=#BFB3A8]#(/usr/bin/cut -d\  -f1 /proc/loadavg) #[fg=#332C27]│ #[fg=#78695E]%a #[fg=#BFB3A8,bold]%d %b %H:%M "

# ── ENGAGEMENT NAMES ────────────────────────────────────
# `-I "#S"` passed the *literal two characters* "#S" as the new session name,
# so renaming anything titled it "#S". Drop the -I and let the prompt do it.
bind R command-prompt -p "rename session (#S): " "rename-session -- '%%'"
bind C display-message -p "new session name: " \; command-prompt -p "name: " "new-session -- '%%'"
bind ? display-popup -E "less -R -X ~/.config/hearth-cheatsheet"

# ═══════════════════════════════════════════════════════════
#  PLUGINS (managed by TPM)
# ═══════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

run '~/.tmux/plugins/tpm/tpm'